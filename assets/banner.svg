<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <linearGradient id="accent-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#9b51e0;#00f2fe" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#9b51e0;#00f2fe;#4facfe" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.15"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes dashMove {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulseNode {
        0%, 100% { r: 6; opacity: 0.8; filter: drop-shadow(0 0 4px #00f2fe); }
        50% { r: 9; opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes signalWave {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .stream-line {
        stroke-dasharray: 12, 12;
        animation: dashMove 25s linear infinite;
      }
      .pulse-dot {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .stat-card-1 {
        animation: floatCard 5s ease-in-out infinite;
      }
      .stat-card-2 {
        animation: floatCard 6s ease-in-out 1s infinite;
      }
      .stat-card-3 {
        animation: floatCard 5.5s ease-in-out 2s infinite;
      }
      .stat-card-4 {
        animation: floatCard 6.2s ease-in-out 0.5s infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Radial Ambient Lighting -->
  <circle cx="200" cy="100" r="300" fill="#3b82f6" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="250" r="350" fill="#8b5cf6" opacity="0.09" filter="blur(80px)"/>
  <circle cx="600" cy="380" r="250" fill="#00f2fe" opacity="0.06" filter="blur(70px)"/>

  <!-- Dynamic Data Pipeline / Trace Curves -->
  <g opacity="0.35">
    <path d="M 0 300 C 300 350, 400 150, 700 220 C 950 280, 1050 120, 1200 180" fill="none" stroke="#00f2fe" stroke-width="2" class="stream-line"/>
    <path d="M 0 160 C 250 80, 500 280, 800 120 C 1000 20, 1100 240, 1200 280" fill="none" stroke="#8b5cf6" stroke-width="2" class="stream-line" style="animation-duration: 35s;"/>
    <path d="M 0 380 C 350 400, 600 260, 900 340 C 1050 380, 1150 320, 1200 330" fill="none" stroke="#10b981" stroke-width="1.5" class="stream-line" style="animation-duration: 20s;"/>
  </g>

  <!-- Telemetry Nodes along curves -->
  <circle cx="350" cy="208" r="7" fill="#00f2fe" class="pulse-dot"/>
  <circle cx="700" cy="220" r="8" fill="#8b5cf6" class="pulse-dot" style="animation-delay: 1s;"/>
  <circle cx="950" cy="245" r="7" fill="#10b981" class="pulse-dot" style="animation-delay: 2s;"/>

  <!-- Scanning laser line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accent-cyan-blue)" stroke-width="1.5" style="animation: scanline 7s linear infinite;" opacity="0.5"/>

  <!-- Header & Title Badge -->
  <g transform="translate(60, 55)">
    <!-- Pill Tag -->
    <rect width="260" height="32" rx="16" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">LIVE TELEMETRY ECOSYSTEM</text>
  </g>

  <!-- Main Banner Title -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" fill="url(#accent-cyan-blue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      AWESOME API ANALYTICS
    </text>
    <text x="0" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">
      The Curated Compass for API Observability, Gateways, Metrics, Traces &amp; Monetization
    </text>
    <text x="0" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
      OpenTelemetry • Prometheus • ClickHouse • Grafana • Kong • Moesif • Treblle • SigNoz
    </text>
  </g>

  <!-- Real-time Interactive Metric Cards (Floating with Dynamic CSS) -->
  <g transform="translate(60, 260)">
    <!-- Card 1: Requests Per Sec -->
    <g class="stat-card-1" transform="translate(0, 0)">
      <rect width="245" height="100" rx="16" fill="url(#glow-card)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" filter="url(#card-shadow)"/>
      <circle cx="28" cy="32" r="12" fill="rgba(56, 189, 248, 0.15)"/>
      <path d="M 23 32 L 27 36 L 33 28" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">THROUGHPUT</text>
      <text x="24" y="72" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="800">48.2k</text>
      <text x="96" y="72" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">req/sec</text>
      <text x="24" y="88" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="500">▲ +14.2% peak traffic</text>
    </g>

    <!-- Card 2: p95 Latency -->
    <g class="stat-card-2" transform="translate(275, 0)">
      <rect width="245" height="100" rx="16" fill="url(#glow-card)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" filter="url(#card-shadow)"/>
      <circle cx="28" cy="32" r="12" fill="rgba(139, 92, 246, 0.15)"/>
      <text x="23" y="36" fill="#a78bfa" font-family="sans-serif" font-size="12">⚡</text>
      <text x="48" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">P95 LATENCY</text>
      <text x="24" y="72" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="800">18.4</text>
      <text x="84" y="72" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="600">ms</text>
      <text x="24" y="88" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="500">▼ -3.1ms optimized</text>
    </g>

    <!-- Card 3: Error Rate & Uptime -->
    <g class="stat-card-3" transform="translate(550, 0)">
      <rect width="245" height="100" rx="16" fill="url(#glow-card)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" filter="url(#card-shadow)"/>
      <circle cx="28" cy="32" r="12" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="23" y="36" fill="#34d399" font-family="sans-serif" font-size="12">🛡️</text>
      <text x="48" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">UPTIME / ERROR</text>
      <text x="24" y="72" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="800">99.99%</text>
      <text x="24" y="88" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="500">Error rate: 0.008%</text>
    </g>

    <!-- Card 4: OpenTelemetry Pipeline -->
    <g class="stat-card-4" transform="translate(825, 0)">
      <rect width="255" height="100" rx="16" fill="url(#glow-card)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1.5" filter="url(#card-shadow)"/>
      <circle cx="28" cy="32" r="12" fill="rgba(244, 63, 94, 0.15)"/>
      <text x="23" y="36" fill="#fb7185" font-family="sans-serif" font-size="12">📡</text>
      <text x="48" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">OBSERVABILITY</text>
      <text x="24" y="72" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="800">80+ OSS</text>
      <text x="135" y="72" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="600">Projects</text>
      <text x="24" y="88" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="500">Full telemetry stack</text>
    </g>
  </g>
</svg>